[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openclaw-quant-research"
version = "0.1.0"
description = "OpenClaw-based multi-agent research and decision support system for the US equity market."
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "yfinance>=0.2.44",
    "chromadb>=0.5",
    "voyageai>=0.2",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
]

nlp = [
    "lxml>=5.0",
    "pdfplumber>=0.11",
    "cohere>=5.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["services"]
